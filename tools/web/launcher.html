<title>Motorhead Madness Survival</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&display=swap">
<style>
/* Layout: the game canvas fills the frame; a dashboard-style loader sits on top until the engine starts. */
:root {
	--asphalt: #15110e;
	--panel: #211a15;
	--rust: #e8902a;
	--rust-dim: #6b4219;
	--bone: #efe4d6;
	--ash: #a3958a;
	--alarm: #ff5a46;
	--display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
	--body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	color-scheme: dark;
}
html, body { height: 100%; }
body {
	background: var(--asphalt);
	color: var(--bone);
	font-family: var(--body);
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
}
#canvas {
	position: fixed;
	inset: 0;
	display: block;
	width: 100%;
	height: 100%;
	background: var(--asphalt);
}
#canvas:focus { outline: none; }
#loader {
	position: fixed;
	inset: 0;
	display: grid;
	place-items: center;
	padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
	padding-left: max(16px, env(safe-area-inset-left, 0px));
	padding-right: max(16px, env(safe-area-inset-right, 0px));
	background:
		repeating-linear-gradient(90deg, transparent 0 46px, rgba(232, 144, 42, 0.05) 46px 48px),
		var(--asphalt);
	z-index: 2;
	transition: opacity 0.4s ease;
}
#loader.done { opacity: 0; pointer-events: none; }
.plate {
	width: min(520px, 100%);
	display: grid;
	gap: 18px;
	padding: 24px;
	background: var(--panel);
	border: 2px solid var(--rust-dim);
	border-radius: 6px;
}
.badge {
	font-family: var(--display);
	font-weight: 600;
	font-size: 0.85rem;
	letter-spacing: 0.18em;
	text-transform: uppercase;
	color: var(--ash);
}
h1 {
	margin: 0;
	font-family: var(--display);
	font-weight: 800;
	font-size: clamp(2.2rem, 9vw, 3.6rem);
	line-height: 0.95;
	text-transform: uppercase;
	color: var(--rust);
	text-wrap: balance;
}
.meter { display: grid; gap: 8px; }
.meter-row {
	display: flex;
	justify-content: space-between;
	gap: 12px;
	font-family: var(--display);
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	font-size: 0.95rem;
	font-variant-numeric: tabular-nums;
}
.track {
	height: 14px;
	background: #0d0a08;
	border: 1px solid var(--rust-dim);
	border-radius: 3px;
	overflow: hidden;
}
.fill {
	height: 100%;
	width: 0%;
	background: repeating-linear-gradient(135deg, var(--rust) 0 10px, #c97618 10px 20px);
	transition: width 0.15s linear;
}
.fill.redline { background: var(--alarm); }
.controls {
	display: grid;
	grid-template-columns: auto 1fr;
	gap: 6px 14px;
	margin: 0;
	font-size: 0.9rem;
	color: var(--ash);
}
.controls dt {
	font-family: var(--display);
	font-weight: 600;
	letter-spacing: 0.06em;
	text-transform: uppercase;
	color: var(--bone);
}
.controls dd { margin: 0; min-width: 0; }
#error {
	margin: 0;
	padding: 12px;
	border: 1px solid var(--alarm);
	border-radius: 4px;
	color: var(--bone);
	font-size: 0.9rem;
	line-height: 1.4;
}
@media (prefers-reduced-motion: reduce) {
	#loader, .fill { transition: none; }
}
</style>

<canvas id="canvas" tabindex="0">Your browser cannot draw the game canvas.</canvas>

<div id="loader" role="status" aria-live="polite">
	<div class="plate">
		<div class="badge">Gameplay prototype · placeholder art</div>
		<h1>Motorhead Madness Survival</h1>
		<div class="meter">
			<div class="meter-row"><span id="stage">Fueling up</span><span id="amount">0.0 / 9.7 MB</span></div>
			<div class="track"><div class="fill" id="fill"></div></div>
		</div>
		<dl class="controls">
			<dt>Road</dt><dd>Drag left / right, or A / D</dd>
			<dt>Boss</dt><dd>Swipe or ← → to dash, ↑ ↓ to switch ring</dd>
			<dt>Pause</dt><dd>‖ button or Esc</dd>
		</dl>
		<p id="error" hidden></p>
	</div>
</div>

<script src="index.js"></script>
<script>
// The engine (index.wasm) ships gzipped so it fits this page's per-file size limit.
// Godot asks for index.wasm / index.pck; this fetch shim serves them unpacked.
const PACKED = {
	'index.wasm': { file: 'engine.gz.wasm', type: 'application/wasm', size: 10084297 },
	'index.pck': { file: 'game.gz.wasm', type: 'application/octet-stream', size: 133181 },
};
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":140904,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};

const ui = {
	loader: document.getElementById('loader'),
	stage: document.getElementById('stage'),
	amount: document.getElementById('amount'),
	fill: document.getElementById('fill'),
	error: document.getElementById('error'),
};
const totalPacked = Object.values(PACKED).reduce((n, p) => n + p.size, 0);
let downloaded = 0;

function showProgress() {
	const mb = (n) => (n / 1048576).toFixed(1);
	ui.amount.textContent = `${mb(downloaded)} / ${mb(totalPacked)} MB`;
	ui.fill.style.width = `${Math.min(100, (downloaded / totalPacked) * 100)}%`;
}

function fail(err) {
	console.error(err);
	ui.stage.textContent = 'Stalled';
	ui.fill.classList.add('redline');
	ui.error.textContent = (err && err.message ? err.message : String(err)) +
		' Reload the page to try again. The game needs a browser with WebGL 2 (current Chrome, Edge, Firefox or Safari).';
	ui.error.hidden = false;
}

const realFetch = window.fetch.bind(window);

async function unpack(entry) {
	const res = await realFetch(entry.file);
	if (!res.ok) throw new Error(`Could not download ${entry.file} (HTTP ${res.status}).`);
	const reader = res.body.getReader();
	const chunks = [];
	for (;;) {
		const { done, value } = await reader.read();
		if (done) break;
		chunks.push(value);
		downloaded += value.byteLength;
		showProgress();
	}
	let blob = new Blob(chunks);
	const head = new Uint8Array(await blob.slice(0, 2).arrayBuffer());
	// Some servers already decode .gz transparently; only unpack real gzip data.
	if (head[0] === 0x1f && head[1] === 0x8b) {
		blob = await new Response(blob.stream().pipeThrough(new DecompressionStream('gzip'))).blob();
	}
	return new Response(blob, {
		status: 200,
		headers: { 'Content-Type': entry.type, 'Content-Length': String(blob.size) },
	});
}

window.fetch = (input, init) => {
	const url = typeof input === 'string' ? input : (input && input.url) || String(input);
	const name = url.split(/[?#]/)[0].split('/').pop();
	return PACKED[name] ? unpack(PACKED[name]) : realFetch(input, init);
};

(function start() {
	const missing = Engine.getMissingFeatures({ threads: false });
	if (typeof DecompressionStream === 'undefined') missing.push('DecompressionStream');
	if (missing.length) {
		fail(new Error('This browser is missing: ' + missing.join(', ') + '.'));
		return;
	}
	const engine = new Engine(GODOT_CONFIG);
	engine.startGame({
		onProgress: () => {
			if (downloaded >= totalPacked) ui.stage.textContent = 'Starting engine';
		},
	}).then(() => {
		ui.stage.textContent = 'Ready';
		ui.loader.classList.add('done');
		setTimeout(() => ui.loader.remove(), 500);
	}, fail);
	ui.stage.textContent = 'Fueling up';
}());
</script>
