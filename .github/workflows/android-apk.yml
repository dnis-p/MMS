name: Builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-web

      - name: Download Godot and Android templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -q -j templates.tpz templates/android_release.apk templates/android_debug.apk templates/web_nothreads_release.zip templates/version.txt -d $T
          rm godot.zip templates.tpz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo ln -s ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          pip install cryptography

      - name: Import project
        # A fresh checkout has no .godot/ cache; without it global class names don't resolve.
        run: timeout 300 godot --headless --path . --import || true

      - name: Smoke test
        run: |
          timeout 180 godot --headless --path . -- --autotest --quit-after-sec=30 2>&1 | tee smoke.log
          grep -q "AUTOTEST DONE" smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Build APK
        run: tools/android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mms-prototype-apk
          path: build/mms-prototype.apk

      - name: Build web version
        run: tools/web/build_web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mms-web-itch-io
          path: build/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  # Publishes the web build at https://<user>.github.io/<repo>/ on every push to the default branch.
  # One-time setup: make the repo public and set Settings > Pages > Source to "GitHub Actions".
  # Until then this job fails harmlessly (continue-on-error) and the APK/web artifacts above still build.
  deploy-pages:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
