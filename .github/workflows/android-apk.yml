name: Builds

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write  # to start the default branch's workflow
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-web

      - name: Download Godot and Android templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_linux.x86_64.zip
          unzip -q godot.zip -d ~/godot
          curl -sSL -o templates.tpz https://github.com/godotengine/godot/releases/download/$V/Godot_v${V}_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $T
          unzip -q -j templates.tpz templates/android_release.apk templates/android_debug.apk templates/web_nothreads_release.zip templates/version.txt -d $T
          rm godot.zip templates.tpz

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo ln -s ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          pip install cryptography

      - name: Import project
        # A fresh checkout has no .godot/ cache; without it global class names don't resolve.
        run: timeout 300 godot --headless --path . --import || true

      - name: Smoke test
        run: |
          timeout 180 godot --headless --path . -- --autotest --quit-after-sec=30 2>&1 | tee smoke.log
          grep -q "AUTOTEST DONE" smoke.log
          ! grep -q "SCRIPT ERROR" smoke.log

      - name: Build web version
        run: tools/web/build_web.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mms-web-itch-io
          path: build/web/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

      # The site is published from the default branch, whose workflow also builds this branch into /dig/.
      # So this only asks that workflow to run again, as soon as this branch has passed its test and built
      # for the web: the APK below doesn't hold it up. dig_only makes it skip the car game's test and APK.
      - name: Ask the default branch to republish the site
        if: github.ref == 'refs/heads/prototype/dig'
        run: gh workflow run android-apk.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}" -f dig_only=true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build APK
        run: tools/android/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: mms-prototype-apk
          path: build/mms-prototype.apk
